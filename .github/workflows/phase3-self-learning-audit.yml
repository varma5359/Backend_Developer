name: Phase 3 self-learning quality checks

on:
  push:
    branches:
      - main
      - phase-3-self-learning-audit
  pull_request:
    branches:
      - main

jobs:
  markdown-quality:
    name: Validate Phase 3 learning documents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static documentation quality gate
        run: python scripts/phase3_self_learning_audit.py

  django-runtime:
    name: Test Phase 3 Django reference workflow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase3_reference
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Django version
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Generate and apply migrations
        run: |
          python manage.py makemigrations profiles
          python manage.py migrate --noinput

      - name: Verify static asset discovery
        run: python manage.py findstatic profiles/css/site.css --verbosity 2

      - name: Run routing, template, model, form, admin and CSRF tests
        run: python manage.py test profiles -v 2
