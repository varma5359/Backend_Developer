name: Phase 3 self-learning documentation audit

on:
  push:
    branches:
      - main
      - phase-3-self-learning-audit
  pull_request:
    branches:
      - main

jobs:
  markdown-quality:
    name: Validate Phase 3 learning documents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static documentation quality gate
        run: python scripts/phase3_self_learning_audit.py
